name: macOS Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Install Dependencies
      run: |
        brew update
        brew install cmake pkg-config dylibbundler gettext libpng libxml2 librsvg espeak-ng \
          sdl3 sdl3_image sdl3_ttf sdl3_mixer sdl3_net

    - name: Checkout TuxMath
      uses: actions/checkout@v4
      with:
        path: tuxmath

    - name: Checkout t4kcommon
      uses: actions/checkout@v4
      with:
        repository: Midhun-M-git/t4kcommon
        path: t4kcommon

    - name: Build and Install t4kcommon
      run: |
        STAGE_DIR="$(pwd)/stage"
        mkdir -p "${STAGE_DIR}"
        HOMEBREW_PREFIX="$(brew --prefix)"
        GETTEXT_PREFIX="$(brew --prefix gettext)"
        cd t4kcommon
        mkdir build && cd build
        cmake .. \
          -DCMAKE_INSTALL_PREFIX="${STAGE_DIR}" \
          -DCMAKE_PREFIX_PATH="${HOMEBREW_PREFIX};${GETTEXT_PREFIX}" \
          -DCMAKE_C_FLAGS="-I${HOMEBREW_PREFIX}/include -I${GETTEXT_PREFIX}/include" \
          -DCMAKE_SHARED_LINKER_FLAGS="-L${HOMEBREW_PREFIX}/lib -L${GETTEXT_PREFIX}/lib -lintl -liconv -lpng" \
          -DCMAKE_EXE_LINKER_FLAGS="-L${HOMEBREW_PREFIX}/lib -L${GETTEXT_PREFIX}/lib -lintl -liconv -lpng"
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: Build TuxMath
      run: |
        STAGE_DIR="$(pwd)/stage"
        HOMEBREW_PREFIX="$(brew --prefix)"
        GETTEXT_PREFIX="$(brew --prefix gettext)"
        cd tuxmath
        mkdir build && cd build
        cmake .. \
          -DCMAKE_INSTALL_PREFIX="${STAGE_DIR}" \
          -DCMAKE_PREFIX_PATH="${HOMEBREW_PREFIX};${GETTEXT_PREFIX};${STAGE_DIR}" \
          -DCMAKE_C_FLAGS="-I${HOMEBREW_PREFIX}/include -I${GETTEXT_PREFIX}/include -I${STAGE_DIR}/include -DHAVE_SETENV=1" \
          -DCMAKE_EXE_LINKER_FLAGS="-L${HOMEBREW_PREFIX}/lib -L${GETTEXT_PREFIX}/lib -L${STAGE_DIR}/lib -lintl -liconv -lpng"
        make -j$(sysctl -n hw.ncpu)

    - name: Assemble TuxMath.app Bundle
      run: |
        STAGE_DIR="$(pwd)/stage"
        HOMEBREW_PREFIX="$(brew --prefix)"
        GETTEXT_PREFIX="$(brew --prefix gettext)"

        mkdir -p TuxMath.app/Contents/MacOS
        mkdir -p TuxMath.app/Contents/Resources/data
        mkdir -p TuxMath.app/Contents/Frameworks

        cp tuxmath/build/src/tuxmath TuxMath.app/Contents/MacOS/
        if [ -f tuxmath/macosx/Info.plist ]; then
          cp tuxmath/macosx/Info.plist TuxMath.app/Contents/
        fi
        cp -R tuxmath/data/* TuxMath.app/Contents/Resources/data/
        if [ -f tuxmath/data/images/icons/tuxmath.icns ]; then
          cp tuxmath/data/images/icons/tuxmath.icns TuxMath.app/Contents/Resources/
        fi
        if [ -d "${HOMEBREW_PREFIX}/share/espeak-ng-data" ]; then
          cp -RL "${HOMEBREW_PREFIX}/share/espeak-ng-data" TuxMath.app/Contents/Resources/
        fi

        dylibbundler -b \
          -x TuxMath.app/Contents/MacOS/tuxmath \
          -d TuxMath.app/Contents/Frameworks/ \
          -p @executable_path/../Frameworks/ \
          -s "${HOMEBREW_PREFIX}/lib" \
          -s "${GETTEXT_PREFIX}/lib" \
          -s "${STAGE_DIR}/lib" \
          -s t4kcommon/build/src \
          -of || true

        codesign --deep --force --verify --verbose --sign - TuxMath.app || true

    - name: Create DMG Package
      run: |
        rm -rf dmg_root TuxMath-macOS.dmg
        mkdir -p dmg_root
        cp -R TuxMath.app dmg_root/
        ln -s /Applications dmg_root/Applications
        hdiutil create -volname "TuxMath" -srcfolder dmg_root -ov -format UDZO TuxMath-macOS.dmg
        rm -rf dmg_root

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TuxMath-macOS
        path: TuxMath-macOS.dmg
